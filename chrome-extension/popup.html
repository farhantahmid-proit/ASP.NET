<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fresnel Live Tab Auditor</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        width: 360px;
        background: #f8fafc;
        color: #0f172a;
      }
      .kicker {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #475569;
        margin: 0 0 4px;
      }
      h1 {
        font-size: 16px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      p.desc {
        font-size: 12px;
        line-height: 1.45;
        color: #475569;
        margin: 0 0 12px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      button {
        appearance: none;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: #ffffff;
        color: #0f172a;
      }
      button.primary {
        background: #0f172a;
        border-color: #0f172a;
        color: #ffffff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        margin-top: 10px;
        font-size: 12px;
        color: #334155;
        min-height: 18px;
      }
      .scores {
        margin-top: 12px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .score-box {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 8px 6px;
        text-align: center;
      }
      .score-label {
        display: block;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        color: #64748b;
        text-transform: uppercase;
      }
      .score-val {
        display: block;
        font-size: 16px;
        font-weight: 700;
        margin-top: 2px;
      }
      .findings-list {
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
        max-height: 150px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .finding-item {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 6px 8px;
        font-size: 11px;
        line-height: 1.35;
      }
      .finding-cat {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        font-weight: 600;
        color: #059669;
        text-transform: uppercase;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <p class="kicker">Fresnel Companion · Manifest V3</p>
    <h1>Live Logged-In Tab Audit</h1>
    <p class="desc">
      Inspect the active browser tab for WCAG accessibility rules, Core Web Vitals, SEO metadata, and security hygiene, then export straight to Fresnel.
    </p>

    <div class="actions">
      <button id="run-audit-btn" class="primary" type="button">
        Run Live Tab Audit
      </button>
      <button id="export-json-btn" type="button" disabled>
        Download Fresnel Audit JSON
      </button>
      <button id="copy-json-btn" type="button" disabled>
        Copy Fresnel JSON to Clipboard
      </button>
    </div>

    <div id="status-box" class="status" role="status" aria-live="polite"></div>
    <div id="scores-grid" class="scores" hidden></div>
    <ul id="findings-list" class="findings-list" hidden></ul>

    <script src="popup.js"></script>
  </body>
</html>
